id: ch.proton.drive
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: protondrive-gui
finish-args:
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: protondrive
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/protondrive /app/bin/protondrive
      - install -Dm755 bin/protondrive-gui /app/bin/protondrive-gui
      # protondrive-vfs (the virtual drive helper) is deliberately not bundled: FUSE is not
      # available inside the sandbox, so the Flatpak build always runs in plain-folder mode.
      - ln -sf protondrive /app/bin/proton-drive-ubuntu
      - install -Dm644 share/applications/ch.proton.drive.desktop /app/share/applications/ch.proton.drive.desktop
      - install -Dm644 share/metainfo/ch.proton.drive.metainfo.xml /app/share/metainfo/ch.proton.drive.metainfo.xml
      - mkdir -p /app/share/icons && cp -R share/icons/hicolor /app/share/icons/
    sources:
      - type: dir
        path: stage
