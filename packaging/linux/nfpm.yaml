name: kosidhar-protondrive
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: net
priority: optional
maintainer: ${PROTONDRIVE_MAINTAINER}
vendor: Kosidhar
homepage: https://github.com/kosidhar/proton-drive
license: MIT AND GPL-3.0-only
description: |-
  Native Linux desktop client and two-way folder sync daemon for Proton Drive.
  Built on the official Proton Drive SDK (@protontech/drive-sdk) with a fast
  native Rust eframe/egui desktop interface, event-based two-way local folder
  synchronization, OS Keyring support, conflict resolution, selective sync,
  and file manager integration for GNOME (Nautilus), Cinnamon (Nemo), and KDE (Dolphin).

overrides:
  deb:
    depends:
      - libc6 (>= ${GLIBC_MIN})
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
      - fuse3
    recommends:
      - libglib2.0-bin
      - libsecret-1-0
      - libnotify-bin
      - xdg-utils
      - libwayland-client0
      - libx11-6
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    depends:
      - glibc >= ${GLIBC_MIN}
      - libxkbcommon
      - (vulkan-loader or libglvnd-egl)
      - fuse3
    recommends:
      - glib2
      - libsecret
      - libnotify
      - xdg-utils
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/protondrive
    dst: /usr/bin/protondrive
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/protondrive-gui
    dst: /usr/bin/protondrive-gui
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/protondrive-vfs
    dst: /usr/bin/protondrive-vfs
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/lib/
    dst: /usr/lib/
    type: tree
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
