name: Feature request
description: An idea for something the app should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: What's hard or impossible today? Knowing the problem helps more than a solution alone.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do now instead?
